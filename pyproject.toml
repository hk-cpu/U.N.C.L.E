[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiag"
version = "0.1.0"
description = "Read and interpret your car's on-board diagnostics over OBD-II"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["obd", "obd2", "obdii", "elm327", "diagnostics", "car", "automotive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

# The core package is pure standard library; pyserial is only needed to talk to
# a physical adapter, so it stays optional and the simulator works without it.
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
dev = ["pyserial>=3.5", "pytest>=7.0"]

[project.scripts]
cardiag = "cardiag.cli:main"

[tool.setuptools.packages.find]
include = ["cardiag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
